name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Codex CLI for isolated installation tests
        run: npm install --global --ignore-scripts @openai/codex@0.146.0
      - name: Build (tsc)
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Codex MCP, installer, hooks and engine regressions
        run: npm test
      - name: Syntax and tool-name contract
        run: npm run check
      - name: Portability guard (no Windows-only path juggling)
        shell: bash
        # 教训：tests 里曾用 pathname.replace(/^\//,'') 拼 file URL —— Windows 正常（/F:/…），
        # Linux 上 pathname 以 / 开头、去掉后变成相对路径，被解析成 <cwd>/home/runner/… 而 ERR_MODULE_NOT_FOUND。
        run: |
          if grep -rIn "pathname\.replace" tests/ scripts/ ; then
            echo "::error::use new URL(rel, import.meta.url).href instead of pathname.replace (POSIX-unsafe)"; exit 1
          fi
          echo "portability guard ok"

      - name: Sanity checks
        run: |
          node --check lib/index.js
          node --check lib/tools.js
          node src/stdio.mjs --version
          npm pack --dry-run
